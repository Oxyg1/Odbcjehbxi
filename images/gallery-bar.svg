<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Барная стойка">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A3A4A"/>
      <stop offset="1" stop-color="#2E1D26"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.6" fill="#ffffff" opacity=".13"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <g opacity=".16" fill="none" stroke="#FAF6F0" stroke-width="3">
    <circle cx="400" cy="300" r="150"/>
    <circle cx="400" cy="300" r="200"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#FAF6F0">
    <text x="400" y="312" font-size="36" letter-spacing="1">Барная стойка</text>
    <text x="400" y="350" font-size="17" opacity=".75" font-family="Arial, Helvetica, sans-serif" letter-spacing="3">ФОТО ГАЛЕРЕИ</text>
  </g>
</svg>
