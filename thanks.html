<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6E1B2B">

  <title>Заявка отправлена — банкетный зал «Кондырев», Кондрово</title>
  <meta name="description" content="Спасибо за заявку в банкетный зал «Кондырев» в Кондрово. Мы свяжемся с вами в ближайшее время.">
  <!-- Служебная страница: в поиске она не нужна -->
  <meta name="robots" content="noindex, follow">

  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* На этой странице нет липкой мобильной панели, поэтому убираем
       зарезервированный под неё отступ снизу — иначе появляется лишняя прокрутка */
    body { padding-bottom: 0; }

    /* Страница-подтверждение: один экран по центру */
    .thanks {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: clamp(2rem, 6vw, 4rem) var(--gutter);
      text-align: center;
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(201, 162, 39, .18), transparent 62%),
        linear-gradient(160deg, var(--burgundy-dk), var(--graphite) 72%);
      color: var(--text-invert);
    }
    .thanks__inner { max-width: 34rem; }
    .thanks__badge {
      display: grid;
      place-items: center;
      width: 86px; height: 86px;
      margin: 0 auto 1.75rem;
      border-radius: 999px;
      background: var(--gold);
      color: var(--graphite);
      box-shadow: 0 12px 40px rgba(201, 162, 39, .3);
    }
    .thanks__badge .icon { width: 42px; height: 42px; }
    .thanks__title { font-size: var(--fs-h2); margin-bottom: .4em; }
    .thanks__text { color: rgba(247, 241, 230, .82); font-size: var(--fs-lead); }
    .thanks__note {
      margin-top: 1.75rem;
      padding: 1rem 1.25rem;
      border: 1px solid var(--line-light);
      border-radius: var(--radius);
      font-size: var(--fs-sm);
      color: rgba(247, 241, 230, .75);
    }
    .thanks__note a { color: var(--gold-soft); font-weight: 700; white-space: nowrap; }
    .thanks__actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .75rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.6 4.8 4.8L19.5 7.2"/></g></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 3.4h3l1.6 4-2 1.4a12 12 0 0 0 6.4 6.4l1.4-2 4 1.6v3a2 2 0 0 1-2.2 2A17.4 17.4 0 0 1 4.2 5.6a2 2 0 0 1 2-2.2Z"/></g></symbol>
</svg>

<main class="thanks">
  <div class="thanks__inner">

    <span class="thanks__badge" aria-hidden="true">
      <svg class="icon"><use href="#i-check"/></svg>
    </span>

    <h1 class="thanks__title">Спасибо за заявку!</h1>
    <p class="thanks__text">
      Мы получили ваше обращение и свяжемся с вами в ближайшее время,
      чтобы уточнить детали и проверить, свободна ли дата.
    </p>

    <p class="thanks__note">
      Если письмо не создалось в почтовой программе, просто позвоните —
      мы на связи круглосуточно: <a href="tel:+79208760222">+7 (920) 876-02-22</a>
    </p>

    <div class="thanks__actions">
      <a class="btn btn--primary btn--lg" href="index.html">Вернуться на сайт</a>
      <a class="btn btn--outline btn--lg" href="tel:+79208760222">
        <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
        Позвонить
      </a>
    </div>
  </div>
</main>

     оставляют с сайта.
     ═══════════════════════════════════════════════════════════════════════ -->

</body>
</html>
