[package]
name = "ton-vanity"
version = "0.1.0"
edition = "2021"
description = "Быстрый генератор TON-кошельков (v4R2) с заданным окончанием адреса"

[dependencies]
curve25519-dalek = "4"
sha2 = { version = "0.10", features = ["compress"] }
rand_chacha = "0.3"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
