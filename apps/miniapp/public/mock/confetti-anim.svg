<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .c { animation: drift 2.2s linear infinite; }
    .c2 { animation-delay: .7s } .c3 { animation-delay: 1.4s }
    @keyframes drift { from { transform: translateY(-16px) rotate(0) } to { transform: translateY(16px) rotate(180deg) } }
    rect { transform-box: fill-box; transform-origin: center }
  </style>
  <rect class="c" x="26" y="40" width="26" height="12" rx="3" fill="#4DD9C0"/>
  <rect class="c c2" x="92" y="20" width="24" height="12" rx="3" fill="#F0566E"/>
  <rect class="c c3" x="140" y="66" width="26" height="12" rx="3" fill="#FFD166"/>
  <rect class="c c2" x="48" y="120" width="24" height="12" rx="3" fill="#8E7CC3"/>
  <rect class="c" x="112" y="146" width="26" height="12" rx="3" fill="#4DD9C0"/>
</svg>
